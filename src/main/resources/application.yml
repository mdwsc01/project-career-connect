spring:
  application:
    name: careerconnect
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  error:
    # Không bao giờ đưa chi tiết lỗi kỹ thuật ra trang lỗi (task T4E7963)
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

app:
  security:
    # Khoá ký cookie "ghi nhớ đăng nhập". Môi trường thật phải đặt biến REMEMBER_ME_KEY.
    remember-me-key: ${REMEMBER_ME_KEY:dev-only-remember-me-key-doi-khi-trien-khai}
