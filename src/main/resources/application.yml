spring:
  application:
    name: careerconnect
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # Giới hạn kỹ thuật để Spring nhận file; giới hạn 5MB thật được kiểm tra trong code
      # để báo lỗi thân thiện ngay trên form (task T4E796D)
      max-file-size: 20MB
      max-request-size: 25MB

server:
  error:
    # Không bao giờ đưa chi tiết lỗi kỹ thuật ra trang lỗi (task T4E7963)
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  tomcat:
    # Cho Tomcat đọc hết request lớn để trả về trang báo lỗi thay vì ngắt kết nối
    max-swallow-size: 30MB

app:
  security:
    # Khoá ký cookie "ghi nhớ đăng nhập". Môi trường thật phải đặt biến REMEMBER_ME_KEY.
    remember-me-key: ${REMEMBER_ME_KEY:dev-only-remember-me-key-doi-khi-trien-khai}
  upload:
    # Thư mục lưu file tải lên (tương đối với thư mục chạy ứng dụng). Đặt biến UPLOAD_DIR để đổi.
    dir: ${UPLOAD_DIR:uploads}
    max-size-mb: 5
