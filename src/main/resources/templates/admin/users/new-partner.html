<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Tạo tài khoản đối tác - Career Connect</title>
</head>
<body>
<section>
    <a th:href="@{/admin/users}" class="d-inline-block mb-3">&laquo; Quay lại danh sách tài khoản</a>
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold mb-4">Tạo tài khoản đối tác</h1>
                    <!-- th:action tự chèn CSRF token -->
                    <form th:action="@{/admin/users/new-partner}" th:object="${form}" method="post" novalidate>
                        <h2 class="h6 text-uppercase text-muted">Công ty</h2>
                        <div class="mb-3">
                            <label for="companyName" class="form-label">Tên công ty</label>
                            <input type="text" class="form-control" th:field="*{companyName}"
                                   th:classappend="${#fields.hasErrors('companyName')} ? 'is-invalid'"
                                   placeholder="Công ty TNHH ABC" autofocus>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('companyName')}"
                                 th:errors="*{companyName}">Lỗi
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="taxCode" class="form-label">Mã số thuế (không bắt buộc)</label>
                            <input type="text" class="form-control" th:field="*{taxCode}"
                                   th:classappend="${#fields.hasErrors('taxCode')} ? 'is-invalid'"
                                   placeholder="0123456789">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('taxCode')}"
                                 th:errors="*{taxCode}">Lỗi
                            </div>
                        </div>
                        <h2 class="h6 text-uppercase text-muted mt-4">Người phụ trách</h2>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Họ tên</label>
                            <input type="text" class="form-control" th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                 th:errors="*{fullName}">Lỗi
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email đăng nhập</label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="hr@congty.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                Lỗi
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu ban đầu</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">Lỗi
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}">Lỗi
                            </div>
                        </div>
                        <p class="form-text">Mật khẩu từ 8 ký tự, có cả chữ và số. Gửi mật khẩu này cho đối tác và nhắc
                            họ đổi sau khi đăng nhập.</p>
                        <div class="d-flex gap-2 justify-content-end">
                            <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Huỷ</a>
                            <button type="submit" class="btn btn-primary">Tạo tài khoản</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
