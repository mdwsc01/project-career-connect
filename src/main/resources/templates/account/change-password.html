<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Đổi mật khẩu - Career Connect</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold text-center mb-1">Đổi mật khẩu</h1>
                    <p class="text-muted text-center mb-4">Nhập mật khẩu hiện tại và mật khẩu mới</p>

                    <!-- th:action tự chèn CSRF token -->
                    <form th:action="@{/account/password}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                            <input type="password" class="form-control" id="currentPassword" name="currentPassword" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'" autofocus>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">Lỗi</div>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Mật khẩu mới</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" >
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">Lỗi</div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Nhập lại mật khẩu mới</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" >
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Lỗi</div>
                        </div>
                        <p class="form-text mb-3">Mật khẩu mới từ 8 ký tự, có cả chữ và số.</p>
                        <button type="submit" class="btn btn-primary w-100">Đổi mật khẩu</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
