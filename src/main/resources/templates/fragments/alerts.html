<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Vùng thông báo. Controller đặt thông báo bằng flash attribute, ví dụ:
    redirectAttributes.addFlashAttribute("successMessage", "Đã lưu hồ sơ");
  Hỗ trợ: successMessage, errorMessage, infoMessage, warningMessage.
-->
<div th:fragment="alerts">
    <div th:if="${param.logout != null}" class="alert alert-info alert-dismissible fade show" role="alert">
        Bạn đã đăng xuất.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">Có lỗi</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div th:if="${warningMessage != null}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${warningMessage}">Cảnh báo</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div th:if="${infoMessage != null}" class="alert alert-info alert-dismissible fade show" role="alert">
        <span th:text="${infoMessage}">Thông tin</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
</div>

</body>
</html>
