<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <!-- Logo -->
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <span class="brand-logo">CC</span> Career Connect
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Mở menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <!-- Menu theo vai trò -->
                <ul class="navbar-nav me-auto">
                    <th:block sec:authorize="hasRole('STUDENT')">
                        <li class="nav-item"><a class="nav-link" th:href="@{/me/profile}">Hồ sơ của tôi</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/me/interviews}">Lời mời phỏng vấn</a></li>
                    </th:block>

                    <th:block sec:authorize="hasRole('PARTNER')">
                        <li class="nav-item"><a class="nav-link" th:href="@{/partner/search}">Tìm ứng viên</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/partner/shortlist}">Shortlist</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/partner/interviews}">Yêu cầu phỏng vấn</a>
                        </li>
                    </th:block>

                    <th:block sec:authorize="hasRole('ADMIN')">
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/reviews}">Hàng chờ duyệt</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}">Quản trị tài khoản</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/skills}">Danh mục kỹ năng</a></li>
                    </th:block>
                </ul>

                <!-- Chưa đăng nhập -->
                <div class="d-flex gap-2" sec:authorize="isAnonymous()">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Đăng nhập</a>
                    <a class="btn btn-light btn-sm" th:href="@{/register}">Đăng ký</a>
                </div>

                <!-- Đã đăng nhập: tên người dùng, vai trò, đăng xuất -->
                <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                    <span class="navbar-text text-white fw-semibold"
                          th:text="${currentUserFullName != null ? currentUserFullName : #authentication.name}">Tên người dùng</span>
                    <span class="badge text-bg-light" sec:authorize="hasRole('STUDENT')">Sinh viên</span>
                    <span class="badge text-bg-light" sec:authorize="hasRole('PARTNER')">Đối tác</span>
                    <span class="badge text-bg-light" sec:authorize="hasRole('ADMIN')">Quản trị viên</span>
                    <a class="btn btn-outline-light btn-sm" th:href="@{/account/password}">Đổi mật khẩu</a>
                    <!-- Đăng xuất phải dùng POST; th:action tự thêm CSRF token -->
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light btn-sm">Đăng xuất</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</header>

</body>
</html>
