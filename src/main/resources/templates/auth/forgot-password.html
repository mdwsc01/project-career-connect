<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Quên mật khẩu - Career Connect</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold text-center mb-1">Quên mật khẩu</h1>
                    <p class="text-muted text-center mb-4">Nhập email đã đăng ký, chúng tôi sẽ gửi mã xác nhận 6 số</p>

                    <!-- th:action tự chèn CSRF token -->
                    <form th:action="@{/forgot-password}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="ban@example.com" autofocus>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                Lỗi
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Gửi mã xác nhận</button>
                    </form>
                    <p class="text-center mt-3 mb-0"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
