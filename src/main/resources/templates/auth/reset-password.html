<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Đặt lại mật khẩu - Career Connect</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold text-center mb-1">Đặt lại mật khẩu</h1>
                    <p class="text-muted text-center mb-4">Nhập mã 6 số đã nhận và mật khẩu mới</p>

                    <!-- th:action tự chèn CSRF token -->
                    <form th:action="@{/reset-password}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="ban@example.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                Lỗi
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="code" class="form-label">Mã xác nhận (6 số)</label>
                            <input type="text" class="form-control" th:field="*{code}"
                                   th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" inputmode="numeric"
                                   maxlength="6" autocomplete="one-time-code" autofocus>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">Lỗi
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Mật khẩu mới</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}"
                                 th:errors="*{newPassword}">Lỗi
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Nhập lại mật khẩu mới</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}">Lỗi
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Đặt lại mật khẩu</button>
                    </form>
                    <p class="text-center mt-3 mb-0">Chưa nhận được mã? <a th:href="@{/forgot-password}">Gửi lại mã</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
