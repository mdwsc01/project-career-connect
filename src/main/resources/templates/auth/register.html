<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Đăng ký sinh viên - Career Connect</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 fw-bold text-center mb-1">Đăng ký tài khoản sinh viên</h1>
                    <p class="text-muted text-center mb-4">Tạo tài khoản để xây dựng hồ sơ năng lực của bạn</p>

                    <!-- th:object gắn form với đối tượng "form"; th:action tự chèn CSRF token -->
                    <form th:action="@{/register}" th:object="${form}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="fullName" class="form-label">Họ tên</label>
                            <input type="text" class="form-control" th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                                   placeholder="Nguyễn Văn A" autofocus>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                 th:errors="*{fullName}">Lỗi họ tên
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   placeholder="ban@example.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">Lỗi email
                            </div>
                        </div>

                        <!-- Ô mật khẩu cố ý không giữ lại giá trị sau khi lỗi (lý do bảo mật) -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <div class="form-text" th:unless="${#fields.hasErrors('password')}">
                                Từ 8 ký tự, có cả chữ và số.
                            </div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">Lỗi mật khẩu
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}">Lỗi nhập lại mật khẩu
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
