<head>
    <title>Không có quyền truy cập - Career Connect</title>
</head>
<body>
<section>

        <p class="text-muted mb-0">Trang này dành cho vai trò khác. Nếu bạn nghĩ đây là nhầm lẫn, hãy liên hệ quản trị
            viên.</p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a class="btn btn-outline-secondary" href="javascript:history.back()">Quay lại</a>
            <a class="btn btn-primary" th:href="@{/}">Về trang chủ</a>
        </div>
    </div>
