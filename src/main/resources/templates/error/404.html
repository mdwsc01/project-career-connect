<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Không tìm thấy trang - Career Connect</title>
</head>
<body>
<section>
    <div class="error-page text-center bg-white border rounded-3 p-5 mx-auto">
        <div class="error-code text-primary">404</div>
        <h1 class="h3 fw-bold mb-3">Không tìm thấy trang bạn yêu cầu</h1>
        <p class="text-muted mb-0" th:text="${message != null and !#strings.isEmpty(message) ? message : 'Đường dẫn không tồn tại hoặc nội dung đã bị xoá.'}">Đường dẫn không tồn tại hoặc nội dung đã bị xoá.</p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a class="btn btn-outline-secondary" href="javascript:history.back()">Quay lại</a>
            <a class="btn btn-primary" th:href="@{/}">Về trang chủ</a>
        </div>
    </div>
</section>
</body>
</html>
