<!DOCTYPE html>
<!--
  Layout chung cho mọi trang (task T4E7962).
  Cách dùng trong một trang con:
    <html th:replace="~{layout/main :: layout(~{::title}, ~{::section})}">
    <head><title>Tiêu đề trang</title></head>
    <body><section> ...nội dung trang... </section></body>
-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">Career Connect</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<header th:replace="~{fragments/header :: header}"></header>

<main class="container flex-grow-1 py-4">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <th:block th:replace="${content}"></th:block>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
